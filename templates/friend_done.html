```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Challenge Started</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            color: white;
            background:
                radial-gradient(circle at top,#302b63,transparent 45%),
                #090916;
        }

        .card {
            width: 100%;
            max-width: 430px;
            padding: 45px 30px;
            text-align: center;
            border-radius: 25px;
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.15);
            backdrop-filter: blur(18px);
            box-shadow: 0 25px 60px rgba(0,0,0,.5);
            animation: pop .6s ease;
        }

        .success {
            width: 85px;
            height: 85px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 42px;
            background: rgba(50,220,130,.12);
            box-shadow: 0 0 35px rgba(50,220,130,.2);
        }

        h1 {
            margin-top: 25px;
            font-size: 29px;
        }

        p {
            margin-top: 14px;
            color: #aaaabc;
            line-height: 1.6;
            font-size: 14px;
        }

        .status {
            margin-top: 25px;
            padding: 15px;
            border-radius: 14px;
            background: rgba(255,255,255,.05);
            color: #ddd;
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: scale(.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

<div class="card">

    <div class="success">✓</div>

    <h1>Challenge Started!</h1>

    <p>
        Your challenge code has been securely stored
        temporarily for the game.
    </p>

    <div class="status">
        🎯 The guessing challenge is now active.
    </div>

</div>

</body>
</html>
```
