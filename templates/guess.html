<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guess Challenge</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            color: white;

                radial-gradient(circle at top left,#302b63,transparent 40%),
                radial-gradient(circle at bottom right,#24243e,transparent 40%),
                #090916;
        }

        .card {
            width: 100%;
            max-width: 500px;
            padding: 35px 25px;
            text-align: center;
            border-radius: 25px;
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.15);
            backdrop-filter: blur(18px);
            box-shadow: 0 25px 70px rgba(0,0,0,.5);
            animation: appear .6s ease;
        }

        .top-icon {
            font-size: 38px;
        }

        h1 {
            margin-top: 10px;
            font-size: 30px;

        .subtitle {
            margin-top: 8px;

        }

        .progress {
            margin: 28px 0 20px;
            color: #aaaabc;

        }

        .boxes {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 20px 0;
        }

        .boxes input {
            width: 65px;
            height: 70px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,.15);
            outline: none;
            background: rgba(0,0,0,.3);
            color: white;
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            transition: .25s;
        }

        .boxes input:focus {
            border-color: #8b7cff;
            box-shadow: 0 0 22px rgba(139,124,255,.3);
            transform: translateY(-3px);
        }

        .boxes input:disabled {
            opacity: .65;
        }

        button {
            width: 100%;
            height: 55px;

            border-radius: 14px;
            color: white;

            background: linear-gradient(135deg,#7c5cff,#a855f7);
            transition: .25s;

</head>

<body>

<div class="card">

    <div class="top-icon">🎯</div>

    <h1>Crack The Challenge</h1>

    <p class="subtitle">
        Find the secret code one digit at a time.
    </p>

    <div class="progress">
        POSITION <b id="positionText">1 / 4</b>
    </div>

    <div class="boxes">
        <input id="d0" maxlength="1" inputmode="numeric" autofocus>
        <input id="d1" maxlength="1" inputmode="numeric" disabled>
        <input id="d2" maxlength="1" inputmode="numeric" disabled>
        <input id="d3" maxlength="1" inputmode="numeric" disabled>
    </div>

    <button onclick="checkCurrent()">
        🔎 Check Digit
    </button>

    <div id="message"></div>

    <div class="hint">
        Enter one digit for the highlighted position.
        A correct digit locks in automatically.
    </div>

</div>

<script>
const room = {{ room|tojson }};
let position = 0;

async function checkCurrent() {

    const input = document.getElementById("d" + position);
    const digit = input.value;

    if (!/^\d$/.test(digit)) {
        showMessage("⚠️ Enter exactly one digit.");
        return;
    }

    const body = new URLSearchParams();

    body.append("room", room);
    body.append("position", position);
    body.append("digit", digit);

    const response = await fetch("/check-digit", {
        method: "POST",
        headers: {
            "Content-Type":
                "application/x-www-form-urlencoded"
        },
        body: body
    });

    const result = await response.json();

    if (!result.ok) {
        showMessage("⚠️ " + result.message);
        return;
    }

    if (result.correct) {

        showMessage("✅ Correct!");

        input.disabled = true;

        position++;

        if (position === 4) {

            document.getElementById("positionText")
                .textContent = "COMPLETE";

            showMessage("🎉 YOU CRACKED THE CODE!");

            return;
        }

        document.getElementById("d" + position)
            .disabled = false;

        document.getElementById("positionText")
            .textContent = `${position + 1} / 4`;

        document.getElementById("d" + position)
            .focus();

    } else {

        showMessage("❌ Wrong! Try again.");

        input.value = "";

        input.focus();
    }
}

function showMessage(text) {

    const message =
        document.getElementById("message");

    message.textContent = text;
}
</script>

</body>
</html>
