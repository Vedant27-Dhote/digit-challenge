<!doctype html>
<html>
<head><title>Set Challenge</title></head>
<body>
<h1>Set the challenge</h1>
<p>Enter a <b>game code</b>, SAM enter your password😊.</p>
<p>Rule: 4 digits; two different digits, each appearing twice.</p>
<form method="post" action="/set-secret">
<input type="hidden" name="room" value="{{ room }}">
<input name="code" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" autofocus required>
<button type="submit">Set challenge</button>
</form>
{% if error %}<p style="color:red">{{ error }}</p>{% endif %}
</body>
</html>
